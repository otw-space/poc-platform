apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poc-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: poc.example.com   # 替换为实际域名
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: poc-platform
                port:
                  number: 80
